# 首版交互状态机。默认不真正主动问候，只输出 greeting_suppressed 以供 Dry-run 验证。
interaction:
  greeting_enabled: false
  stable_before_attention_sec: 1.5
  greeting_cooldown_sec: 10.0 # Temporary same-target cooldown for testing.
  # Covers a tracker-ID reset after temporary occlusion, so the same visitor
  # is not welcomed again merely because it receives a new temporary ID.
  global_greeting_cooldown_sec: 60.0
  # A visitor who has just spoken is already in an interaction; do not greet
  # them retrospectively when duplex later returns to idle.
  post_conversation_greeting_suppress_sec: 60.0
  face_loss_to_idle_sec: 3.0
