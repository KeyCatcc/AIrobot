# 人脸跟随保守版参数。首版只开放 yaw，pitch 必须完成真机方向校准后才可改为 true。
head_follow:
  min_face_area_ratio: 0.015
  min_confidence: 0.55
  stable_frames_required: 8
  deadband_x_ratio: 0.10
  deadband_y_ratio: 0.12
  max_pitch_deg: 6.0
  # YuNet live-follow calibration: a larger but still bounded yaw range and
  # faster target response.  Validate this setting on clear workspace before
  # enabling it in unattended interaction.
  max_yaw_deg: 20.0
  max_speed_deg_per_sec: 28.0
  return_delay_sec: 2.0
  return_speed_deg_per_sec: 10.0
  # Calibrated on physical hardware: positive image-x offset requires
  # positive neck_yaw_joint input through the current bridge mapping.
  yaw_sign: 1.0
  pitch_sign: 1.0
  enable_pitch: false
